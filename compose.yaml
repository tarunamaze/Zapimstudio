services:
  studio:
    build: .
    ports:
      - "127.0.0.1:5080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Bootstrap__Email: ${BOOTSTRAP_EMAIL:?Set BOOTSTRAP_EMAIL}
      Bootstrap__Password: ${BOOTSTRAP_PASSWORD:?Set BOOTSTRAP_PASSWORD}
      AI__ApiKey: ${OPENAI_API_KEY:-}
      PublicBaseUrl: ${PUBLIC_BASE_URL:-}
      Publishing__Enabled: ${PUBLISHING_ENABLED:-false}
    volumes:
      - studio-data:/data
    restart: unless-stopped
volumes:
  studio-data:
