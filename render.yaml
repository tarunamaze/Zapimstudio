# Free, disposable demonstration deployment. Data resets on restart/redeploy.
services:
  - type: web
    name: zapim-studio-demo
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_FORWARDEDHEADERS_ENABLED
        value: "true"
      - key: ASPNETCORE_HTTP_PORTS
        value: "8080"
      - key: StoragePath
        value: /data
      - key: Publishing__Enabled
        value: "false"
      - key: Bootstrap__Email
        sync: false
      - key: Bootstrap__Password
        sync: false
